<!DOCTYPE html>
<html>
<head>
    <title>CS 1.6 — Tea or Coffee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #topbar .title { font-size: 14px; font-weight: 600; color: #f5a623; }
        #topbar .user  { font-size: 13px; color: #aaa; }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #game-area {
            flex: 1;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Overlays ─────────────────────────────────────────────── */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.93);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 10;
        }
        .overlay h2   { font-size: 20px; color: #f5a623; }
        .overlay p    { font-size: 13px; color: #999; max-width: 380px; text-align: center; line-height: 1.6; }
        .overlay a    { color: #f5a623; font-size: 13px; }

        /* Progress bar */
        #progress-wrap {
            width: 320px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            height: 8px;
        }
        #progress-bar {
            height: 100%;
            background: #f5a623;
            width: 0%;
            transition: width 0.2s ease;
        }
        #progress-label { font-size: 12px; color: #666; }

        /* ── Sidebar ──────────────────────────────────────────────── */
        #sidebar {
            width: 240px;
            background: #141414;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        #sidebar h3 {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f5a623;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        #kill-feed {
            padding: 6px 10px;
            border-bottom: 1px solid #222;
            min-height: 80px;
            max-height: 110px;
            overflow-y: auto;
        }
        #kill-feed h4 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #444;
            margin-bottom: 4px;
        }
        .kill-entry {
            font-size: 11px;
            color: #999;
            padding: 1px 0;
            animation: fadein 0.25s ease;
        }
        .kill-entry .killer { color: #4ade80; }
        .kill-entry .victim { color: #f87171; }
        .kill-entry .hs     { color: #fbbf24; font-size: 10px; margin-left: 3px; }

        #leaderboard { flex: 1; overflow-y: auto; }

        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-bottom: 1px solid #1c1c1c;
        }
        .player-rank { font-size: 11px; color: #444; width: 16px; text-align: center; }
        .player-info { flex: 1; min-width: 0; }
        .player-name {
            font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .player-sub { font-size: 11px; color: #555; }
        .player-kd  { font-size: 13px; font-weight: 700; color: #4ade80; }

        /* Server status strip */
        #server-strip {
            padding: 7px 14px;
            font-size: 11px;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
        .dot.green { background: #4ade80; }
        .dot.red   { background: #f87171; }

        @keyframes fadein { from { opacity:0 } to { opacity:1 } }
    </style>
</head>
<body>

<div id="topbar">
    <span class="title">☕ Tea or Coffee — CS 1.6</span>
    <span class="user" id="display-name">Loading…</span>
</div>

<div id="main">
    <div id="game-area">

        <!-- Auth error (shown if not logged in) -->
        <div class="overlay" id="auth-overlay" style="display:none; z-index:20">
            <h2>Login Required</h2>
            <p>You must be signed into Tea or Coffee before playing.</p>
            <a href="/">← Sign in</a>
        </div>

        <!-- Loading overlay (shown while fetching assets) -->
        <div class="overlay" id="loading-overlay">
            <h2 id="load-title">Starting up…</h2>
            <p id="load-msg">Fetching game assets from server</p>
            <div id="progress-wrap"><div id="progress-bar"></div></div>
            <span id="progress-label">0%</span>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <h3>CS Leaderboard</h3>

        <div id="kill-feed">
            <h4>Kill Feed</h4>
        </div>

        <div id="leaderboard">
            <div style="padding:14px;color:#444;font-size:12px">Loading…</div>
        </div>

        <div id="server-strip">
            <div class="dot" id="srv-dot"></div>
            <span id="srv-label">Checking server…</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xash3d-fwgs@latest/dist/raw.js"></script>
<script type="module">
import JSZip from 'https://cdn.skypack.dev/jszip@3.10.1';

// ── Auth ──────────────────────────────────────────────────────────────────────
const token    = localStorage.getItem('toc_token');
const username = localStorage.getItem('toc_username') || 'Player';

if (!token) {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('loading-overlay').style.display = 'none';
} else {
    document.getElementById('display-name').textContent = username;
    init();
}

const API = window.location.origin;
const WS  = API.replace(/^http/, 'ws');

// ── Helpers ───────────────────────────────────────────────────────────────────
function setProgress(pct, label, mb) {
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent = label;
    localStorage.setItem('cs_progress', JSON.stringify({ pct, mb: mb || 0, done: pct >= 100 }));
}

function setLoadMsg(title, msg) {
    document.getElementById('load-title').textContent  = title;
    document.getElementById('load-msg').textContent    = msg;
}

async function postEvent(event, extra = {}) {
    try {
        await fetch(`${API}/cs/event`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ event, ...extra }),
        });
    } catch (_) {}
}

// ── Kill feed ─────────────────────────────────────────────────────────────────
function addKill(html) {
    const feed = document.getElementById('kill-feed');
    const div  = document.createElement('div');
    div.className = 'kill-entry';
    div.innerHTML = html;
    feed.appendChild(div);
    while (feed.querySelectorAll('.kill-entry').length > 10) feed.querySelector('.kill-entry').remove();
    feed.scrollTop = feed.scrollHeight;
}

// ── Leaderboard ───────────────────────────────────────────────────────────────
function renderLeaderboard(players) {
    const el = document.getElementById('leaderboard');
    if (!players.length) {
        el.innerHTML = '<div style="padding:14px;color:#444;font-size:12px">No games yet</div>';
        return;
    }
    el.innerHTML = players.map((p, i) => `
        <div class="player-row">
            <span class="player-rank">${i + 1}</span>
            <div class="player-info">
                <div class="player-name">${p.nickname || p.name}</div>
                <div class="player-sub">${p.kills}K / ${p.deaths}D &nbsp;·&nbsp; ${p.wins}W</div>
            </div>
            <span class="player-kd">${Number(p.kd_ratio).toFixed(2)}</span>
        </div>`).join('');
}

// ── Live leaderboard WebSocket ────────────────────────────────────────────────
function connectLeaderboardWS() {
    const ws = new WebSocket(`${WS}/cs/ws/cs?token=${token}`);
    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'cs_stats') renderLeaderboard(d.players);
    };
    ws.onclose = () => setTimeout(connectLeaderboardWS, 3000);
}

// ── Server status ─────────────────────────────────────────────────────────────
async function pollServerStatus() {
    try {
        const r   = await fetch(`${API}/cs/server/status`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const d   = await r.json();
        const dot = document.getElementById('srv-dot');
        const lbl = document.getElementById('srv-label');
        if (d.running) {
            dot.className = 'dot green';
            lbl.textContent = `Server online · ${d.players} / ${d.max_players}`;
        } else {
            dot.className = 'dot red';
            lbl.textContent = 'Server offline';
        }
    } catch (_) {
        document.getElementById('srv-label').textContent = 'Server unreachable';
    }
    setTimeout(pollServerStatus, 10_000);
}

// ── WebRTC signaling ──────────────────────────────────────────────────────────
// Connects to the FastAPI relay so xash3d can exchange SDP offers/answers
// with the HLDS WebRTC bridge running on the server.
let signalingWs = null;
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function connectSignaling() {
    signalingWs = new WebSocket(`${WS}/cs/ws/signal?token=${token}&room=main`);

    signalingWs.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        // Forward signaling messages to xash3d Module if it exposes a handler
        if (window.Module?.onSignal) window.Module.onSignal(msg);
    };

    signalingWs.onclose = () => setTimeout(connectSignaling, 3000);
}

// Expose send helper so xash3d can send signaling messages back
window.__csSignalSend = (msg) => {
    if (signalingWs?.readyState === WebSocket.OPEN) {
        signalingWs.send(JSON.stringify(msg));
    }
};

// ── Module.print hook — parse CS 1.6 console events ─────────────────────────
function hookPrint() {
    const orig = window.Module?.print;
    window.Module.print = (text) => {
        if (orig) orig(text);

        // Kill line: "PlayerA killed PlayerB with weapon_ak47"
        const km = text.match(/^(.+?)\skilled\s(.+?)\swith\s(.+)$/i);
        if (km) {
            const [, killer, victim, weapon] = km;
            const hs   = text.toLowerCase().includes('headshot');
            const isMe = killer.toLowerCase() === username.toLowerCase();
            const iDied = victim.toLowerCase() === username.toLowerCase();

            if (isMe) {
                postEvent(hs ? 'headshot' : 'kill', { weapon, victim });
                addKill(`<span class="killer">${killer}</span> → <span class="victim">${victim}</span> [${weapon}]` + (hs ? '<span class="hs">HS</span>' : ''));
            } else if (iDied) {
                postEvent('death', { weapon });
                addKill(`<span class="victim">${victim}</span> ✝ <span class="killer">${killer}</span>`);
            } else {
                addKill(`${killer} → <span class="victim">${victim}</span>`);
            }
            return;
        }

        if (/counter-terrorists win/i.test(text)) addKill('<span class="killer">★ Counter-Terrorists Win</span>');
        if (/terrorists win/i.test(text))         addKill('<span class="killer">★ Terrorists Win</span>');
        if (/round draw/i.test(text))             addKill('Round Draw');
    };
}

// ── Main init ─────────────────────────────────────────────────────────────────
async function init() {
    connectLeaderboardWS();
    connectSignaling();
    pollServerStatus();

    // 1. Wait for server-side setup to finish (runs once on first boot)
    setLoadMsg('Server Setup', 'Server is preparing game assets for the first time…');
    setProgress(0, 'Waiting for server');

    await (async () => {
        for (let attempt = 0; attempt < 120; attempt++) {   // wait up to 20 min
            try {
                const r = await fetch(`${API}/cs/setup/status`);
                const d = await r.json();
                if (d.ready) break;

                const parts = [];
                if (!d.assets_ready) parts.push('downloading assets');
                if (!d.hlds_ready)   parts.push('downloading server');
                setLoadMsg('Server Setup', `Server is ${parts.join(' & ')} — this only happens once`);
            } catch (_) {}
            await new Promise(res => setTimeout(res, 10_000));  // poll every 10 s
        }
    })();

    // 3. Fetch server status to get the game server address
    let serverIp = '127.0.0.1';
    let serverPort = '27015';
    try {
        const r = await fetch(`${API}/cs/server/status`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const d = await r.json();
        if (d.running && d.address) {
            [serverIp, serverPort] = d.address.split(':');
        }
    } catch (_) {}

    // 4. Fetch valve.zip from server with progress
    setLoadMsg('Loading CS 1.6', 'Downloading game assets…');
    let zipBuffer;
    try {
        const res = await fetch('/game/assets/valve.zip');
        if (!res.ok) throw new Error(`Asset fetch failed: ${res.status}`);

        const total  = parseInt(res.headers.get('content-length') || '0');
        const reader = res.body.getReader();
        const chunks = [];
        let  loaded  = 0;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            if (total) {
                const mb  = Math.round(loaded / 1024 / 1024);
                const pct = Math.round(loaded / total * 90);
                setProgress(pct, `${mb} MB`, mb);
            }
        }
        zipBuffer = new Uint8Array(chunks.reduce((a, c) => [...a, ...c], [])).buffer;
    } catch (err) {
        setLoadMsg('Assets Missing', 'Ask your admin to run scripts/setup_cs_server.py on the server.');
        setProgress(0, err.message);
        return;
    }

    // 3. Unzip
    setLoadMsg('Unpacking…', 'Extracting game files');
    setProgress(90, 'Extracting…');

    const zip   = await JSZip.loadAsync(zipBuffer);
    const files = {};
    await Promise.all(Object.keys(zip.files).map(async (p) => {
        const entry = zip.files[p];
        if (entry.dir) return;
        files[`/rodir/${p}`] = await entry.async('uint8array');
    }));

    setProgress(100, 'Ready');
    setLoadMsg('Starting engine…', '');

    // 4. Start xash3d
    document.getElementById('loading-overlay').style.display = 'none';
    postEvent('session_start');
    window.addEventListener('beforeunload', () => postEvent('session_end'));

    window.Module = {
        arguments: [
            '-windowed', '-game', 'cstrike',
            '+_vgui_menus', '0',
            '+connect', `${serverIp}:${serverPort}`,
            '+name', username,
        ],
        canvas: document.getElementById('canvas'),
        ctx: document.getElementById('canvas').getContext('webgl2', {
            alpha: false, depth: true, stencil: true, antialias: true,
        }),
        dynamicLibraries: [
            'filesystem_stdio.wasm',
            'libref_gles3compat.wasm',
            'cl_dlls/menu_emscripten_wasm32.wasm',
            'dlls/cs_emscripten_wasm32.so',
            'cl_dlls/client_emscripten_wasm32.wasm',
            '/rwdir/filesystem_stdio.so',
        ],
        onRuntimeInitialized: function () {
            Object.keys(files).forEach((k) => {
                const dir = k.split('/').slice(0, -1).join('/');
                this.FS.mkdirTree(dir);
                this.FS.writeFile(k, files[k]);
            });
            this.FS.chdir('/rodir');
            hookPrint();
        },
        locateFile: (p) => {
            const cdn = 'https://cdn.jsdelivr.net/npm/xash3d-fwgs@latest/dist/';
            const cs  = 'https://cdn.jsdelivr.net/npm/cs16-client@latest/dist/';
            return {
                'xash.wasm':                             cdn + 'xash.wasm',
                '/rwdir/filesystem_stdio.so':             cdn + 'filesystem_stdio.wasm',
                'filesystem_stdio.wasm':                  cdn + 'filesystem_stdio.wasm',
                'libref_gles3compat.wasm':                cdn + 'libref_gles3compat.wasm',
                'cl_dlls/menu_emscripten_wasm32.wasm':    cs  + 'cl_dll/menu_emscripten_wasm32.wasm',
                'dlls/cs_emscripten_wasm32.so':           cs  + 'dlls/cs_emscripten_wasm32.so',
                'cl_dlls/client_emscripten_wasm32.wasm':  cs  + 'cl_dll/client_emscripten_wasm32.wasm',
            }[p] || p;
        },
    };
}
</script>
</body>
</html>
