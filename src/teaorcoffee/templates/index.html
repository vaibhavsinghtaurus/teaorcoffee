<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tea or Coffee — Sign In</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="toasts"></div>
<div class="login-wrap">

  <!-- ── LOGIN CARD ── -->
  <div class="login-card card" id="login-card">
    <div class="login-logo">☕</div>
    <div class="login-title">Tea or Coffee</div>
    <div class="login-sub">Sign in to place your order</div>

    <div class="form-group" style="position:relative">
      <label class="form-label">Company</label>
      <input id="company-search" placeholder="Search company or office…" autocomplete="off">
      <input type="hidden" id="company-sel-id" value="">
      <div id="company-suggestions" class="autocomplete-list" style="display:none"></div>
    </div>
    <div class="form-group">
      <input id="name" placeholder="Your name or nickname…" autocomplete="username">
    </div>
    <div class="form-group">
      <input id="password" type="password" placeholder="Password…" autocomplete="current-password">
    </div>
    <div id="msg"></div>
    <button class="btn btn-primary btn-full mt8" id="sign-in">SIGN IN</button>

    <!-- ── Register a new company ── -->
    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;text-align:center">
      <a href="/register" style="color:var(--muted);text-decoration:none">＋ Register your company — no approval needed</a>
    </div>

    <div style="text-align:right;margin-top:12px">
      <button class="btn btn-sm" id="theme-btn"></button>
    </div>
  </div>

</div><!-- /login-wrap -->

<script src="/static/app.js"></script>
<script>
Theme.init();

// If already logged in, redirect
if (Auth.getToken()) {
  const user = Auth.getUser();
  location.href = Auth.homeFor(user.role, user.company_mode);
}

document.getElementById('theme-btn').onclick = () => Theme.toggle();
document.getElementById('name').focus();

// ── Company search (autocomplete, nothing selected by default) ────────────────
let companiesCache = [];
const searchEl = document.getElementById('company-search');
const hiddenEl = document.getElementById('company-sel-id');
const suggEl = document.getElementById('company-suggestions');

async function loadCompanies() {
  const [[s1, d1], [s2, d2]] = await Promise.all([
    API.publicGet('/companies/active'),
    API.publicGet('/distributors/active'),
  ]);
  const companies = (s1 === 200 && d1.companies) ? d1.companies : [];
  const distributors = (s2 === 200 && d2.companies) ? d2.companies : [];
  companiesCache = companies.map(c => ({ ...c, icon: '🏢' })).concat(distributors.map(c => ({ ...c, icon: '🚚' })));
}

function renderSuggestions(filter) {
  const q = filter.trim().toLowerCase();
  const options = companiesCache
    .map(o => ({ id: o.id, label: `${o.icon} ${o.name}${o.address ? ' — ' + o.address : ''}` }))
    .concat([{ id: '__dist', label: '🚚 Distributor / Staff Access (unsure which)' }]);
  const matches = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;
  suggEl.innerHTML = matches.length
    ? matches.map(o => `<div class="autocomplete-item" data-id="${o.id}" data-label="${o.label}">${o.label}</div>`).join('')
    : '<div class="autocomplete-item text-muted">No matches</div>';
  suggEl.style.display = '';
  suggEl.querySelectorAll('[data-id]').forEach(el => el.addEventListener('mousedown', (e) => {
    e.preventDefault();
    hiddenEl.value = el.dataset.id;
    searchEl.value = el.dataset.label;
    suggEl.style.display = 'none';
  }));
}

searchEl.addEventListener('focus', () => renderSuggestions(searchEl.value));
searchEl.addEventListener('input', () => { hiddenEl.value = ''; renderSuggestions(searchEl.value); });
searchEl.addEventListener('blur', () => setTimeout(() => { suggEl.style.display = 'none'; }, 150));

// ── Login flow ────────────────────────────────────────────────────────────────
const nameEl = document.getElementById('name');
const pwEl   = document.getElementById('password');
const msgEl  = document.getElementById('msg');
const btn    = document.getElementById('sign-in');

async function doLogin() {
  const name = nameEl.value.trim();
  const companyRaw = document.getElementById('company-sel-id').value;
  if (!name) { msgEl.innerHTML = '<div class="alert alert-err">Please enter your name.</div>'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  msgEl.innerHTML = '';

  const body = { name };
  const pw = pwEl.value.trim();
  if (pw) body.password = pw;
  // Distributor/staff option sends no company_id
  if (companyRaw && companyRaw !== '__dist') body.company_id = companyRaw;

  const [status, data] = await API.publicPost('/login', body);
  btn.disabled = false; btn.textContent = 'SIGN IN';

  if (status === 0) { msgEl.innerHTML = `<div class="alert alert-err">Cannot reach server: ${data.detail}</div>`; return; }

  if (data.success) {
    Auth.setSession(data);
    location.href = Auth.homeFor(data.role, data.company_mode);
  } else if (data.password_required) {
    msgEl.innerHTML = '<div class="alert alert-warn">Password required — please enter your password.</div>';
    pwEl.focus();
  } else {
    msgEl.innerHTML = `<div class="alert alert-err">${data.message || data.detail || 'Login failed.'}</div>`;
  }
}

btn.addEventListener('click', doLogin);
[nameEl, pwEl].forEach(el => el.addEventListener('keydown', e => e.key === 'Enter' && doLogin()));

loadCompanies();
</script>
</body>
</html>
