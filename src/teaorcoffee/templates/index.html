<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tea or Coffee — Sign In</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="toasts"></div>
<div class="login-wrap">

  <!-- ── SETUP CARD (shown only if no main admin exists) ── -->
  <div class="login-card card" id="setup-card" style="display:none">
    <div class="login-logo">☕</div>
    <div class="login-title">Tea or Coffee</div>
    <div class="login-sub" style="margin-bottom:8px">First-Time Setup</div>
    <div class="alert alert-info mb16">No super admin has been configured yet. Set one up to get started.</div>
    <div class="form-group"><label class="form-label">Your Name</label>
      <input id="setup-name" placeholder="e.g. Vaibhav" autocomplete="username"></div>
    <div class="form-group"><label class="form-label">Set Your Password</label>
      <input id="setup-pw" type="password" placeholder="Choose a password…" autocomplete="new-password"></div>
    <div id="setup-msg"></div>
    <button class="btn btn-primary btn-full mt8" id="setup-btn">CREATE SUPER ADMIN</button>
    <div style="text-align:right;margin-top:12px">
      <button class="btn btn-sm" id="setup-theme-btn"></button>
    </div>
  </div>

  <!-- ── LOGIN CARD ── -->
  <div class="login-card card" id="login-card" style="display:none">
    <div class="login-logo">☕</div>
    <div class="login-title">Tea or Coffee</div>
    <div class="login-sub">Sign in to place your order</div>

    <div class="form-group">
      <label class="form-label">Company</label>
      <select id="company-sel">
        <option value="">Loading companies…</option>
      </select>
    </div>
    <div class="form-group">
      <input id="name" placeholder="Your name or nickname…" autocomplete="username">
    </div>
    <div class="form-group">
      <input id="password" type="password" placeholder="Password…" autocomplete="current-password">
    </div>
    <div id="msg"></div>
    <button class="btn btn-primary btn-full mt8" id="sign-in">SIGN IN</button>

    <!-- ── Register a new company ── -->
    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;text-align:center">
      <a href="/register" style="color:var(--muted);text-decoration:none">＋ Register your company — no approval needed</a>
    </div>

    <div style="text-align:right;margin-top:12px">
      <button class="btn btn-sm" id="theme-btn"></button>
    </div>
  </div>

</div><!-- /login-wrap -->

<script src="/static/app.js"></script>
<script>
Theme.init();

// If already logged in, redirect
if (Auth.getToken()) {
  const user = Auth.getUser();
  location.href = Auth.homeFor(user.role, user.company_mode);
}

// Wire up theme buttons for both cards
document.getElementById('theme-btn').onclick = () => Theme.toggle();
document.getElementById('setup-theme-btn').onclick = () => Theme.toggle();

// ── Bootstrap: check setup status, then load companies ───────────────────────
async function init() {
  const [s, d] = await API.publicGet('/setup/status');
  if (s !== 200) {
    // Can't reach server — show login anyway
    showLogin();
    return;
  }
  if (d.needs_setup) {
    showSetup();
  } else {
    await loadCompanies();
    showLogin();
  }
}

function showSetup() {
  document.getElementById('setup-card').style.display = '';
  document.getElementById('login-card').style.display = 'none';
  Theme.applyBtn('setup-theme-btn');
}

function showLogin() {
  document.getElementById('setup-card').style.display = 'none';
  document.getElementById('login-card').style.display = '';
  Theme.applyBtn('theme-btn');
  document.getElementById('name').focus();
}

// ── Setup flow ────────────────────────────────────────────────────────────────
document.getElementById('setup-btn').onclick = async () => {
  const name = document.getElementById('setup-name').value.trim();
  const pw   = document.getElementById('setup-pw').value;
  const msg  = document.getElementById('setup-msg');
  if (!name || !pw) { msg.innerHTML = '<div class="alert alert-warn">Fill all fields.</div>'; return; }
  const btn = document.getElementById('setup-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const [s, d] = await API.publicPost('/setup', { name, password: pw });
  btn.disabled = false; btn.textContent = 'CREATE SUPER ADMIN';
  if (s === 200 && d.success) {
    msg.innerHTML = `<div class="alert alert-ok">${d.message}</div>`;
    setTimeout(async () => { await loadCompanies(); showLogin(); }, 1200);
  } else {
    msg.innerHTML = `<div class="alert alert-err">${d.detail || d.message || 'Error.'}</div>`;
  }
};
document.getElementById('setup-pw').addEventListener('keydown', e => e.key === 'Enter' && document.getElementById('setup-btn').click());

// ── Load active companies ─────────────────────────────────────────────────────
async function loadCompanies() {
  const [s, d] = await API.publicGet('/companies/active');
  const sel = document.getElementById('company-sel');
  if (s !== 200 || !d.companies || !d.companies.length) {
    sel.innerHTML = '<option value="">No active companies</option>';
    return;
  }
  sel.innerHTML =
    d.companies.map(o => `<option value="${o.id}">${o.name}${o.address ? ' — ' + o.address : ''}</option>`).join('') +
    '<option value="__dist">🚚 Distributor / Staff Access</option>';
}

// ── Login flow ────────────────────────────────────────────────────────────────
const nameEl = document.getElementById('name');
const pwEl   = document.getElementById('password');
const msgEl  = document.getElementById('msg');
const btn    = document.getElementById('sign-in');

async function doLogin() {
  const name = nameEl.value.trim();
  const companyRaw = document.getElementById('company-sel').value;
  if (!name) { msgEl.innerHTML = '<div class="alert alert-err">Please enter your name.</div>'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  msgEl.innerHTML = '';

  const body = { name };
  const pw = pwEl.value.trim();
  if (pw) body.password = pw;
  // Distributor/staff option sends no company_id
  if (companyRaw && companyRaw !== '__dist') body.company_id = companyRaw;

  const [status, data] = await API.publicPost('/login', body);
  btn.disabled = false; btn.textContent = 'SIGN IN';

  if (status === 0) { msgEl.innerHTML = `<div class="alert alert-err">Cannot reach server: ${data.detail}</div>`; return; }

  if (data.success) {
    Auth.setSession(data);
    location.href = Auth.homeFor(data.role, data.company_mode);
  } else if (data.password_required) {
    msgEl.innerHTML = '<div class="alert alert-warn">Password required — please enter your password.</div>';
    pwEl.focus();
  } else {
    msgEl.innerHTML = `<div class="alert alert-err">${data.message || data.detail || 'Login failed.'}</div>`;
  }
}

btn.addEventListener('click', doLogin);
[nameEl, pwEl].forEach(el => el.addEventListener('keydown', e => e.key === 'Enter' && doLogin()));

init();
</script>
</body>
</html>
