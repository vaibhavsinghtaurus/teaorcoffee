<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distributor — Tea or Coffee</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="toasts"></div>

<div class="topbar">
  <div class="topbar-title">🚚 <span id="role-label">Distributor</span> <span class="text-muted" style="font-size:13px;margin-left:8px" id="uname"></span></div>
  <div class="topbar-right">
    <button class="btn btn-sm" id="theme-btn"></button>
    <button class="btn btn-sm btn-danger" id="logout-btn">Logout</button>
  </div>
</div>

<div class="page">
  <div class="tabs" id="tabs">
    <button class="tab-btn">📋 Today's Orders</button>
    <!-- Admin-only tabs added dynamically -->
  </div>

  <div class="tab-pane" id="tab-orders">
    <div class="flex-between mb16">
      <h3 style="margin:0">Today's Orders</h3>
      <button class="btn btn-sm" id="refresh-orders">🔄 Refresh</button>
    </div>
    <div class="metrics" id="order-metrics"></div>
    <div class="table-wrap mt8"><table><thead><tr><th>Name</th><th>Order</th><th>Qty</th></tr></thead><tbody id="orders-tbody"></tbody></table></div>
  </div>

  <!-- Dynamic panes added for admin -->
  <div class="tab-pane" id="tab-staff" style="display:none">
    <h3>Staff</h3>
    <div class="form-group mb16">
      <label class="form-label">Company</label>
      <select id="staff-company-sel"></select>
    </div>
    <button class="btn btn-sm mb8" id="load-staff">🔄 Load Staff</button>
    <div class="table-wrap mb16"><table><thead><tr><th>Name</th><th>Position</th><th>Role</th><th></th></tr></thead><tbody id="staff-tbody"></tbody></table></div>
    <div class="card">
      <h4>Add Staff Member</h4>
      <div class="form-row mb8">
        <input id="add-staff-name" placeholder="Full name…">
        <select id="add-staff-role"><option value="distributor_staff">distributor_staff</option><option value="company_admin">company_admin</option></select>
      </div>
      <div class="form-group mb8"><select id="add-staff-pos"><option>Loading positions…</option></select></div>
      <button class="btn btn-primary btn-full" id="add-staff-btn">Add Staff</button>
      <div id="add-staff-msg" class="mt8"></div>
    </div>
  </div>

  <div class="tab-pane" id="tab-positions" style="display:none">
    <h3>Positions</h3>
    <div class="form-group mb16">
      <label class="form-label">Company</label>
      <select id="pos-company-sel"></select>
    </div>
    <button class="btn btn-sm mb8" id="load-positions">🔄 Load Positions</button>
    <div class="table-wrap mb16"><table><thead><tr><th>Position</th><th>Level</th><th></th></tr></thead><tbody id="pos-tbody"></tbody></table></div>
    <div class="card">
      <h4>Add Position</h4>
      <div class="form-row mb8">
        <input id="new-pos-name" placeholder="e.g. Manager">
        <input type="number" id="new-pos-level" value="1" min="1" max="10" style="max-width:80px">
      </div>
      <button class="btn btn-primary btn-full" id="add-pos-btn">Add Position</button>
      <div id="add-pos-msg" class="mt8"></div>
    </div>
  </div>

  <div class="tab-pane" id="tab-companies" style="display:none">
    <h3>Distributor Companies</h3>
    <button class="btn btn-sm mb16" id="load-companies">🔄 Load Companies</button>
    <div class="table-wrap mb16"><table><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody id="companies-tbody"></tbody></table></div>
    <div class="card" id="create-company-card">
      <h4>Add Distributor Company</h4>
      <div id="offices-note" class="alert alert-info mb8" style="display:none">Requires admin password in the admin panel first.</div>
      <div class="form-group"><select id="co-office"></select></div>
      <div class="form-row mb8">
        <input id="co-name" placeholder="Company name…">
        <input id="co-pw" type="password" placeholder="Admin password…">
      </div>
      <button class="btn btn-primary btn-full" id="create-co-btn">Create Company</button>
      <div id="create-co-msg" class="mt8"></div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
const sess = Auth.require(['main_admin','company_admin','distributor_staff']);
if (!sess) throw new Error('redirect');
Theme.init();
document.getElementById('logout-btn').onclick = () => Auth.clearSession();
document.getElementById('uname').textContent = sess.username;

const isAdmin = ['main_admin','company_admin'].includes(sess.role);
document.getElementById('role-label').textContent = isAdmin ? 'Distributor Admin' : `Distributor — ${sess.position || 'Staff'}`;

// Build tabs dynamically if admin
const tabsEl = document.getElementById('tabs');
if (isAdmin) {
  ['👥 Staff','📌 Positions','🏢 Companies'].forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = label;
    tabsEl.appendChild(btn);
  });
  document.getElementById('tab-staff').style.display = '';
  document.getElementById('tab-positions').style.display = '';
  document.getElementById('tab-companies').style.display = '';
}

// Custom tab init to handle dynamic tabs
function initDynTabs() {
  const btns = tabsEl.querySelectorAll('.tab-btn');
  const paneIds = ['tab-orders', 'tab-staff', 'tab-positions', 'tab-companies'];
  const panes = paneIds.map(id => document.getElementById(id));
  btns.forEach((btn, i) => {
    btn.onclick = () => {
      btns.forEach(b => b.classList.remove('active'));
      panes.forEach(p => p && p.classList.remove('active'));
      btn.classList.add('active');
      if (panes[i]) panes[i].classList.add('active');
    };
  });
  btns[0].click();
}
initDynTabs();

// ── Orders ───────────────────────────────────────────────────────────────────
async function loadOrders() {
  const [s,d] = await API.get('/distributor/orders');
  if (s !== 200) { Toast.err(d.detail || 'Failed.'); return; }
  const totals = d.totals || {}, orders = d.orders || [], count = d.order_count ?? orders.length;
  const metrics = Object.entries(totals).map(([n,i]) => ({ label: `${typeof i==='object'?i.emoji:''} ${n}`, value: typeof i==='object'?i.total:i }));
  metrics.push({ label: '👥 Total Orders', value: count });
  renderMetrics('order-metrics', metrics);
  document.getElementById('orders-tbody').innerHTML = orders.map(o =>
    `<tr><td>${o.name}</td><td>${o.product_emoji||'☕'} ${o.product_name||''}</td><td>${o.qty||1}</td></tr>`
  ).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">No orders today.</td></tr>';
}
document.getElementById('refresh-orders').onclick = loadOrders;
loadOrders();

if (!isAdmin) { /* nothing more */ return; } // staff sees only orders

// ── Admin: Companies list ────────────────────────────────────────────────────
let companiesList = [];
async function loadCompanies() {
  const [s,d] = await API.get('/distributor/companies');
  companiesList = (s === 200 ? d.companies : []) || [];
  return companiesList;
}

async function renderCompanies() {
  await loadCompanies();
  document.getElementById('companies-tbody').innerHTML = companiesList.map(c =>
    `<tr><td><strong>${c.name}</strong></td><td>${c.is_active ? '🟢 Active' : '🔴 Inactive'}</td>
     <td><button class="btn btn-sm" onclick="toggleCompany('${c.id}',${!c.is_active})">${c.is_active ? 'Deactivate' : 'Activate'}</button></td></tr>`
  ).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">No companies.</td></tr>';

  // Populate company selects
  const opts = companiesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  ['staff-company-sel','pos-company-sel'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = opts; });
  if (companiesList[0]) loadPositionsForStaff(companiesList[0].id);
}
async function toggleCompany(id, active) {
  const [s,d] = await API.post(`/distributor/companies/active?company_id=${id}&is_active=${active}`, {});
  if (s === 200) { Toast.ok(d.message || 'Updated.'); renderCompanies(); }
  else Toast.err(d.detail || 'Error');
}
document.getElementById('load-companies').onclick = renderCompanies;

// ── Admin: Office list for create company ────────────────────────────────────
if (sess.role === 'main_admin') {
  API.get('/offices?password=').then(([s,d]) => {
    // We don't have admin pw here, so show note
    document.getElementById('offices-note').style.display = '';
  });
}

document.getElementById('create-co-btn').onclick = async () => {
  const name = document.getElementById('co-name').value.trim();
  const pw = document.getElementById('co-pw').value.trim();
  // For office_id, we need selection. Load offices first.
  const [os, od] = await API.adminGet('/offices', { password: pw });
  const msg = document.getElementById('create-co-msg');
  if (os !== 200) { msg.innerHTML = `<div class="alert alert-err">Invalid admin password or could not load offices.</div>`; return; }
  const offices = od.offices || [];
  if (!offices.length) { msg.innerHTML = `<div class="alert alert-err">No offices found.</div>`; return; }
  // For simplicity, pick first office or show select
  const sel = document.getElementById('co-office');
  if (!sel.options.length || sel.options[0].value === '') {
    sel.innerHTML = offices.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
    msg.innerHTML = `<div class="alert alert-info">Select an office and click Create again.</div>`;
    return;
  }
  const officeId = sel.value;
  if (!name || !pw || !officeId) { msg.innerHTML = `<div class="alert alert-warn">Fill all fields.</div>`; return; }
  const [s,d] = await API.post('/distributor/companies', { name, office_id: officeId, password: pw });
  if (s === 200 && d.success) { msg.innerHTML = `<div class="alert alert-ok">${d.message}</div>`; document.getElementById('co-name').value = ''; renderCompanies(); }
  else if (s === 409) msg.innerHTML = `<div class="alert alert-warn">${d.detail||'Already exists.'}</div>`;
  else msg.innerHTML = `<div class="alert alert-err">${d.detail||'Error.'}</div>`;
};

// ── Admin: Staff ─────────────────────────────────────────────────────────────
document.getElementById('load-staff').onclick = async () => {
  const companyId = document.getElementById('staff-company-sel').value;
  if (!companyId) return;
  const [s,d] = await API.get(`/distributor/companies/${companyId}/staff`);
  if (s !== 200) { Toast.err(d.detail || 'Error'); return; }
  const staff = d.staff || [];
  document.getElementById('staff-tbody').innerHTML = staff.map(m =>
    `<tr><td><strong>${m.name}</strong></td><td>${m.position||'—'}</td><td>${m.role||'distributor_staff'}</td>
     <td><button class="btn btn-sm btn-danger" onclick="removeStaff(${m.id})">Remove</button></td></tr>`
  ).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">No staff.</td></tr>';
};
async function removeStaff(id) {
  const [s,d] = await API.del('/distributor/staff', { user_id: id, password: '' });
  if (s === 200) { Toast.ok('Removed.'); document.getElementById('load-staff').click(); }
  else Toast.err(d.detail || 'Error');
}
async function loadPositionsForStaff(companyId) {
  const [s,d] = await API.get(`/distributor/companies/${companyId}/positions`);
  const positions = (s === 200 ? d.positions : []) || [];
  const sel = document.getElementById('add-staff-pos');
  sel.innerHTML = positions.map(p => `<option value="${p.name}">${p.name}</option>`).join('') || '<option>No positions</option>';
}
document.getElementById('staff-company-sel').addEventListener('change', e => loadPositionsForStaff(e.target.value));
document.getElementById('add-staff-btn').onclick = async () => {
  const companyId = document.getElementById('staff-company-sel').value;
  const name = document.getElementById('add-staff-name').value.trim();
  const role = document.getElementById('add-staff-role').value;
  const pos = document.getElementById('add-staff-pos').value;
  const msg = document.getElementById('add-staff-msg');
  if (!name || !pos) { msg.innerHTML = '<div class="alert alert-warn">Fill all fields.</div>'; return; }
  const [s,d] = await API.post('/distributor/staff', { company_id: companyId, name, role, position: pos, password: '' });
  if (s === 200 && d.success) { msg.innerHTML = `<div class="alert alert-ok">${d.message}</div>`; document.getElementById('add-staff-name').value = ''; document.getElementById('load-staff').click(); }
  else if (s === 409) msg.innerHTML = `<div class="alert alert-warn">${d.detail||'Already exists.'}</div>`;
  else msg.innerHTML = `<div class="alert alert-err">${d.detail||'Error.'}</div>`;
  setTimeout(() => { msg.innerHTML = ''; }, 4000);
};

// ── Admin: Positions ─────────────────────────────────────────────────────────
document.getElementById('load-positions').onclick = async () => {
  const companyId = document.getElementById('pos-company-sel').value;
  if (!companyId) return;
  const [s,d] = await API.get(`/distributor/companies/${companyId}/positions`);
  if (s !== 200) { Toast.err(d.detail || 'Error'); return; }
  document.getElementById('pos-tbody').innerHTML = (d.positions||[]).map(p =>
    `<tr><td><strong>${p.name}</strong></td><td>Level ${p.level}</td>
     <td><button class="btn btn-sm btn-danger" onclick="removePosition('${p.id}')">Remove</button></td></tr>`
  ).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">No positions.</td></tr>';
};
async function removePosition(id) {
  const [s,d] = await API.del('/distributor/positions', { position_id: id, password: '' });
  if (s === 200) { Toast.ok(`Position removed.`); document.getElementById('load-positions').click(); }
  else Toast.err(d.detail || 'Error');
}
document.getElementById('add-pos-btn').onclick = async () => {
  const companyId = document.getElementById('pos-company-sel').value;
  const name = document.getElementById('new-pos-name').value.trim();
  const level = parseInt(document.getElementById('new-pos-level').value);
  const msg = document.getElementById('add-pos-msg');
  if (!name) { msg.innerHTML = '<div class="alert alert-warn">Enter a position name.</div>'; return; }
  const [s,d] = await API.post('/distributor/positions', { company_id: companyId, name, level, password: '' });
  if (s === 200 && d.success) { msg.innerHTML = `<div class="alert alert-ok">${d.message}</div>`; document.getElementById('new-pos-name').value = ''; document.getElementById('load-positions').click(); }
  else if (s === 409) msg.innerHTML = `<div class="alert alert-warn">Position already exists.</div>`;
  else msg.innerHTML = `<div class="alert alert-err">${d.detail||'Error.'}</div>`;
  setTimeout(() => { msg.innerHTML = ''; }, 4000);
};

renderCompanies();
</script>
</body>
</html>
